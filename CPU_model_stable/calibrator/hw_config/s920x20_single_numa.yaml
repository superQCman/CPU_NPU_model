profile_name: s920x20_single_numa
source_config: calibrator/hw_config/s920x20_single_numa.yaml
source_paper: []
notes:
  - This profile models one local NUMA execution domain on the S920X20 host.
  - Main numeric fields under core/cache/memory/pipeline are limited to directly observed values or values calibrated with hardware_calibration/raw/s920x20_recalib_20260428_3run.
  - Cache response latencies are effective random-access pointer-chase proxies, not datasheet tag-array latencies.
  - Pipeline width fields intentionally mirror the same effective issue-width proxy because the analytical model consumes min(fetch, decode, rename, dispatch, issue, commit).
  - cpu_clock is the effective GHz observed from perf cycles/task-clock on the pinned issue-loop microbench, not only the exported cpuinfo_max_freq ceiling.
  - simd_width_bits=256 is the hardware-max SVE width detected from /proc/sys/abi/sve_default_vector_length.
  - fp_latency_cycles.vector_sp_* are the calibrated user-space vector proxy from the included NEON chain microbench; a separate SVE-specific latency loop is not stored in this profile yet.
  - fp_throughput_per_cycle is measured with the independent SVE vector throughput microbench in hardware_calibration/raw/remote.
  - Memory bandwidth is the best NUMA-local STREAM triad result at 40 threads.
  - Whitebox-only copy bandwidth, random gather bandwidth, and launch overhead fields were remeasured on 2026-04-28 as 3-run medians with the dedicated OpenMP microbenches.
  - L1 response latency uses the 10-run focused 48KiB pointer-chase median from the same recheck bundle because the full 3-run convergence pass showed transient L1 variation.
  - The remote EDAC mem_type string is only Registered-SDR, so dram_speed_mt_s and DDR generation fields were intentionally omitted instead of guessed.
