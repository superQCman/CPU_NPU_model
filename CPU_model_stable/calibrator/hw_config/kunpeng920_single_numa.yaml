profile_name: kunpeng920_single_numa
source_config: calibrator/hw_config/kunpeng920_single_numa.yaml
source_paper:
  - "legacy_external:鲲鹏920.pdf"
  - "legacy_external:A_Comparative_Analysis_of_Kunpeng_920_on_HPC_Workloads.pdf"
notes:
  - This profile models one local NUMA execution domain on the 4-socket Kunpeng-920 host.
  - Main numeric fields under core/cache/memory/pipeline are limited to directly observed values or values calibrated with hardware_calibration/raw/local.
  - The current effective performance fields use the 5-run median recorded in hardware_calibration/raw/local_convergence_5run after reducing host background load on 2026-04-19.
  - Cache response latencies are effective random-access pointer-chase proxies, not datasheet tag-array latencies.
  - The local L2 and L3 proxy points were tightened to 256 KiB and 16 MiB because those capacities converged materially better than the earlier 384 KiB and 8 MiB picks.
  - Pipeline width fields intentionally mirror the same effective issue-width proxy because the analytical model consumes min(fetch, decode, rename, dispatch, issue, commit).
  - cpu_clock is the effective GHz observed from perf cycles/task-clock on the pinned issue-loop microbench, not a vendor max-frequency string.
  - Memory bandwidth is the 5-run median NUMA-local STREAM triad result at 24 threads.
  - fp_throughput_per_cycle is measured with the independent NEON vector throughput microbench in hardware_calibration/raw/local.
  - Unverified placeholder fields from the earlier profile were removed instead of being kept as facts.
  - Whitebox-only copy bandwidth, random gather bandwidth, and launch overhead fields were measured locally on 2026-04-21 with the dedicated OpenMP microbenches and are now required by the hard-policy whitebox routes.
