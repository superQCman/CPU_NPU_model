profile_name: s920x20_single_numa
source_config: "legacy_external:single_op_stage1_mlp/hardware_profile/s920x20_single_numa.yaml"
source_paper: []
notes:
- This profile models one local NUMA execution domain on the current host.
- core/cache/frequency values are detected from lscpu, cpufreq sysfs, and cache sysfs
  for the selected NUMA node.
- Memory bandwidth is a theoretical peak derived as channels_per_numa(4) * dram_speed_mt_s(3200)
  * 8 bytes / 1000 = 102.4 GB/s.
- 'dram_speed_mt_s source: heuristic_default_hi_freq_host; channels_per_numa source:
  derived_from_populated_dimms. Override these with CLI flags if you have measured
  platform data.'
- cache latency, memory latency, pipeline width, and FP latency/throughput values
  remain conservative modeling placeholders because the local OS does not expose them
  directly.
- Detected 16 populated EDAC DIMMs across the host, each totaling 32768 MiB on average.
