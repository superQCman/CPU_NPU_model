profile_name: kunpeng920_host_4socket
source_config: "legacy_external:single_op_stage1_mlp/hardware_profile/kunpeng920_host_4socket.yaml"
source_paper:
  - "legacy_external:鲲鹏920.pdf"
  - "legacy_external:A_Comparative_Analysis_of_Kunpeng_920_on_HPC_Workloads.pdf"
notes:
  - This is the default hardware profile for ORT/single_op_stage1_mlp.
  - Host-observable topology values are taken from the local machine with lscpu, sysfs cache metadata, and numactl.
  - Cache latency, memory latency, memory bandwidth, pipeline-width, and FP instruction-width/latency values are reference values from the cited Kunpeng 920 papers when the local machine cannot expose them directly.
  - The local host is a 4-socket Kunpeng-920 machine with 8 NUMA nodes. This differs from the paper setups that describe single-socket or 2-socket configurations, so total-socket-level fields are scaled to the current host when the per-socket paper values are explicit.
core:
  architecture: aarch64
  vendor: HiSilicon
  model_name: Kunpeng-920
  sockets: 4
  total_cores: 192
  cores_per_socket: 48
  threads_per_core: 1
  numa_nodes: 8
  cores_per_die: 24
  cpu_clock: 2.6GHz
cache:
  l1i:
    size: 64KiB
    assoc: 4
    shared_by_cpus: 1
    tag_latency_cycles: 1
    data_latency_cycles: 1
    response_latency_cycles: 1
  l1d:
    size: 64KiB
    assoc: 4
    shared_by_cpus: 1
    tag_latency_cycles: 1
    data_latency_cycles: 1
    response_latency_cycles: 1
  l2:
    size: 512KiB
    assoc: 8
    shared_by_cpus: 1
    tag_latency_cycles: 10
    data_latency_cycles: 10
    response_latency_cycles: 10
  l3_per_die:
    size: 24MiB
    assoc: 15
    shared_by_cpus: 24
    tag_latency_cycles: 20
    data_latency_cycles: 20
    response_latency_cycles: 20
  cacheline_bytes: 64
  coherency_line_bytes_l3: 128
memory:
  numa_nodes: 8
  controllers_per_socket: 8
  controllers_total: 32
  channels_per_socket: 8
  channels_total: 32
  dram_type: DDR4
  dram_speed_mt_s: 2933
  bandwidth_gb_s_per_socket: 200.0
  bandwidth_gb_s_total: 800.0
  local_mem_delay_ns: 90.0
  remote_mem_delay_ns: 110.0
pipeline:
  fetch_width: 4
  decode_width: 4
  rename_width: 4
  dispatch_width: 4
  issue_width: 4
  wb_width: 4
  commit_width: 4
instruction:
  isa_family: ARMv8.2-A
  simd_name: NEON
  simd_width_bits: 128
  fp_latency_cycles:
    vector_dp_add: 4
    vector_dp_mul: 5
    vector_dp_fma: 7
    vector_sp_add: 5
    vector_sp_mul: 5
    vector_sp_fma: 5
    scalar_dp_add: 5
    scalar_dp_mul: 5
    scalar_sp_add: 4
    scalar_sp_mul: 5
  fp_throughput_per_cycle:
    vector_dp_add: 1
    vector_dp_mul: 1
    vector_dp_fma: 1
    vector_sp_add: 2
    vector_sp_mul: 2
    vector_sp_fma: 2
    scalar_dp_sp_add: 2
    scalar_dp_sp_mul: 2
    scalar_dp_sp_fma: 2
host_cross_check:
  lscpu_architecture: aarch64
  lscpu_vendor: HiSilicon
  lscpu_model_name: Kunpeng-920
  lscpu_sockets: 4
  lscpu_cores_per_socket: 48
  lscpu_threads_per_core: 1
  lscpu_numa_nodes: 8
  lscpu_l1d_per_core_kib: 64
  lscpu_l1i_per_core_kib: 64
  lscpu_l2_per_core_kib: 512
  lscpu_l3_per_numa_mib: 24
paper_cross_check:
  huawei_research_2021_pipeline_width: 4
  huawei_research_2021_l1i_kib: 64
  huawei_research_2021_l1d_kib: 64
  huawei_research_2021_l2_kib: 512
  huawei_research_2021_total_l3_mib: 64
  hpc_workloads_2024_frequency_ghz: 2.6
  hpc_workloads_2024_simd_width_bits: 128
  hpc_workloads_2024_memory_bandwidth_gb_s_per_socket: 200.0
